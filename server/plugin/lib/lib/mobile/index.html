<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d6bfe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DSH Remote</title>
<link rel="stylesheet" href="/mobile/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="返回" hidden></button>
    <h1 class="topbar-title" id="title">DSH Remote</h1>
    <button class="icon-btn" id="themeBtn" aria-label="切换主题"></button>
  </header>
  <main id="view" class="view"></main>
  <div class="composer" id="composer" hidden>
    <div class="chips" id="chips"></div>
    <div class="composer-row">
      <textarea id="input" rows="1" placeholder="输入消息…" enterkeyhint="send" autocomplete="off"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="发送"></button>
    </div>
  </div>
  <div class="mask" id="mask" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="模型选择" hidden></div>
  <div class="dialog" id="dialog" role="alertdialog" aria-label="审批与提问" hidden></div>
</div>
<script src="/mobile/app.js"></script>
</body>
</html>
