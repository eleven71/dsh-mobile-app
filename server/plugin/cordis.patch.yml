# User layer (web profile)
# - browse directory picker: injected automatically by the dsh-plugin-mobile-remote plugin
# - The mobile-remote auth proxy rewrites Host/Origin to the fixed internal
#   authority 'dsh.remote'; trust it permanently here so plain `dsh web` works
#   without --trusted-host. (Note: user-layer patches replace the row's whole
#   config, so --trusted-host CLI values are not merged into this row.)
- id: web-runtime
  config:
    printUrl: true
    surfaceContext: true
    trustedHosts:
      - dsh.remote
      # 隧道域名（每次 cloudflared 重启会变；start-dsh.ps1 会在隧道变化时同步更新此项）
      - xxx.trycloudflare.com
